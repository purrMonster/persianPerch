# groom (persianPerch M2): write a record when this unit stops: the morning check, 06:00.
# The leading '-' means a recorder problem never fails the job. systemd sets
# $SERVICE_RESULT, $EXIT_CODE and $EXIT_STATUS for ExecStopPost=.
[Service]
ExecStopPost=-/usr/bin/python3 /opt/purrbrews/stacks/_lib/groom-record.py check cellar %n
