# groom (persianPerch M2): write a record when this unit stops: cellar backs up the dump store, 02:30.
# The leading '-' means a recorder problem never fails the job. systemd sets
# $SERVICE_RESULT, $EXIT_CODE and $EXIT_STATUS for ExecStopPost=.
[Service]
ExecStopPost=-/usr/bin/python3 /opt/purrbrews/stacks/_lib/groom-record.py store cellar %n
