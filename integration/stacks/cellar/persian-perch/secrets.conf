# persianPerch's settings, one line per key (format: stacks/README.md -> secrets.conf).
# Written from persianPerch's secrets.env, which names every setting and how to get it:
# https://github.com/purrMonster/persianPerch/blob/main/secrets.env
# ./setup-secrets.sh asks for the prompts, makes the hex values, and writes secrets.env.local
# here (gitignored). A value is never typed anywhere else: not in this file, not in a chat.
# Order of creation, and where each credential comes from: persianPerch's integration/ROLLOUT.md.
#
# Three settings are not here because they hold the domain or a LAN address, which a `value`
# line can't expand; docker-compose.yml builds them from DOMAIN and fleet.env instead:
# PERCH_GLARE_URL, PERCH_WHISKERS_URL, PERCH_BINOCS_SPEEDTEST_URL, PERCH_MEOW_NTFY_URL and
# PERCH_PUBLIC_URL.

# ── perch itself (not secret) ───────────────────────────────────────────────
PERCH_REPO_DIR                    value /opt/purrbrews
PERCH_TRAIL_DB                    value /data/scentTrail.db
PERCH_TRAIL_DAYS                  value 90
PERCH_ROLLUP_DAYS                 value 400

# ── purr: Komodo Core's read API, on this node ──────────────────────────────
PERCH_PURR_URL                    value http://komodo-core:9120
PERCH_PURR_KEY                    prompt Komodo API key of the read-only service user "perch" (Komodo UI -> Settings -> Users)
PERCH_PURR_SECRET                 prompt the secret shown with that Komodo API key (shown once)
PERCH_PURR_EVERY                  value 30s

# ── glare: Gatus on sieve, through its gatus-api router (Authelia Basic auth) ─
PERCH_GLARE_USER                  value ocicat
PERCH_GLARE_PASSWORD              prompt the password of the LLDAP service account ocicat (member of perch_api_group only)
PERCH_GLARE_EVERY                 value 60s

# ── disks: the Scrutiny hub, on this node ───────────────────────────────────
PERCH_DISKS_URL                   value http://scrutiny:8080
PERCH_DISKS_EVERY                 value 15m

# ── whiskers: Home Assistant on mochaPot ────────────────────────────────────
PERCH_WHISKERS_TOKEN              prompt optional long-lived token of the NON-admin Home Assistant user "perch" (blank = whiskers stays off)
PERCH_WHISKERS_ENTITIES           value /config/whiskers.yml
PERCH_WHISKERS_EVERY              value 30s

# ── binocs: far away ────────────────────────────────────────────────────────
PERCH_BINOCS_SPEEDTEST_TOKEN      prompt optional speedtest-tracker API token with the read ability only (blank = no speedtest)
PERCH_BINOCS_RELEASES_EVERY       value 7d
PERCH_BINOCS_EVERY                value 15m

# ── groom: the records this node's backup units leave ───────────────────────
PERCH_GROOM_DIR                   value /var/lib/purrbrews/groom

# ── kitten push tokens: one per node, roastery included ─────────────────────
# Read each one in your own terminal on cellar and type it into that node's install prompt.
PERCH_KITTEN_TOKEN_SIEVE          hex 64
PERCH_KITTEN_TOKEN_PERCOLATOR     hex 64
PERCH_KITTEN_TOKEN_CELLAR         hex 64
PERCH_KITTEN_TOKEN_MOCHAPOT       hex 64
PERCH_KITTEN_TOKEN_GRINDER        hex 64
PERCH_KITTEN_TOKEN_ROASTERY       hex 64

# ── meow: alerts ────────────────────────────────────────────────────────────
PERCH_MEOW_NTFY_TOKEN             prompt perch's own ntfy token (tk_ and 29 characters; made on sieve, see ROLLOUT.md)
PERCH_MEOW_QUIET                  value 23:00-07:00
PERCH_MEOW_DIGEST                 value 07:30
PERCH_MEOW_CRITICAL_URL           prompt the public ntfy.sh critical topic URL Gatus already uses (NTFY_CRITICAL_TOPIC in sieve's gatus/secrets.env.local)
# Signs the acknowledge links on pushes. Never typed anywhere.
PERCH_ACK_SECRET                  hex 64

# ── nineLives: the outside heartbeat ────────────────────────────────────────
PERCH_NINELIVES_URL               prompt the healthchecks.io ping URL of the check "perch" (period 5 min, grace 10 min)

NOTE persianPerch: read ROLLOUT.md before the first up. The Komodo key, the ocicat password, perch's ntfy token and the healthchecks URL must exist first.
NOTE persianPerch: PERSIAN_PERCH_REF (a persianPerch tag or full commit to build) is asked for in .env.local, with DOMAIN and the rest.
