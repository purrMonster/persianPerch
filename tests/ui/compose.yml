# UI check: build perch's real image, seed sample events, then let Playwright load
# every page (tests/ui/shoot.py). Run from the project root:
#   docker compose -f tests/ui/compose.yml up --build --abort-on-container-exit --exit-code-from playwright
# Screenshots land in ./screenshots (gitignored).
name: persian-perch-ui
services:
  perch:
    build: ../..
    image: persian-perch:ui-test
    environment:
      PERCH_REPO_DIR: /fleet
      PERCH_TRAIL_DB: /tmp/scentTrail.db
      PERCH_TZ: Asia/Kolkata
      PERCH_KITTEN_TOKEN_SIEVE: fake-ui-token-sieve-not-real   # a made-up token, for the live check only
    volumes:
      - ../../.cache/purrbrews-containers:/fleet:ro
      - ./seed.py:/app/seed.py:ro
      - ../komodoFake.py:/app/komodoFake.py:ro   # the fake Komodo the seed runs purr against
    command: ["sh", "-c", "cd /app && python seed.py && exec python -m perch"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"]
      interval: 2s
      timeout: 5s
      retries: 30
  playwright:
    build: .                  # tests/ui/Dockerfile: the pinned Playwright image + its Python package
    image: persian-perch:ui-playwright
    depends_on:
      perch:
        condition: service_healthy
    environment:
      PERCH_URL: http://perch:8080
      UI_STATE_CHANGE: "1"
      UI_KITTEN_TOKEN_SIEVE: fake-ui-token-sieve-not-real
      OUT_DIR: /out
    volumes:
      - ./shoot.py:/shoot.py:ro
      - ./live.py:/live.py:ro
      - ../../screenshots:/out
    command: ["sh", "-c", "python3 /shoot.py && python3 /live.py"]
