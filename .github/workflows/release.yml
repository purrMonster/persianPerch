# release: a v* tag (v0.1.0) runs every CI check, then builds the image and pushes it to
# ghcr.io/purrmonster/persian-perch, then makes the GitHub release. Nothing else publishes an image
# (owner, 2026-10-14: tags only, matching the fleet's reviewed deployments). Pull requests only build (ci.yml).
name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/purrmonster/persian-perch  # GHCR names are lower-case; the org is purrMonster

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # the GitHub release
      packages: write   # the image
      id-token: write   # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - name: The tag matches pyproject.toml's version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "$want" = "$have" ] || { echo "tag $GITHUB_REF_NAME but pyproject.toml says $have"; exit 1; }
          grep -q "^## \[$want\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $want"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # No latest: metadata-action adds one to every semver tag by default (latest=auto), which put a
          # latest on 0.1.0 against the owner's "tags only" (2026-10-14; fleet runbook 2026-10-15).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=persianPerch
            org.opencontainers.image.description=The purrBrews fleet's unified watcher (read-only)
            org.opencontainers.image.licenses=NOASSERTION
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64   # cellar is an x86-64 M710q
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PERCH_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: The line for the fleet's compose file
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          line="image: ${IMAGE}:${version}@${DIGEST}"
          {
            echo "### ${GITHUB_REF_NAME} published"
            echo
            echo "For \`stacks/cellar/persian-perch/docker-compose.yml\` in purrbrews-containers:"
            echo
            echo '```yaml'
            echo "    ${line}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$line" > fleet-image.txt
      - name: GitHub release, notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          { echo; echo "**Image:** \`$(cat fleet-image.txt | sed 's/^image: //')\`"; } >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "persianPerch $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
